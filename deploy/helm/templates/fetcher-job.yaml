apiVersion: batch/v1
kind: Job
metadata:
  name: dota2metalab-fetcher
  namespace: {{ .Values.global.namespace }}
  annotations:
    "argocd.argoproj.io/sync-wave": "2"
    "argocd.argoproj.io/hook": "Sync"
    "argocd.argoproj.io/hook-delete-policy": "BeforeHookCreation"
    "argocd.argoproj.io/sync-options": "Replace=true"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 7200  # 2 hours max
  template:
    spec:
      containers:
        - name: fetcher
          image: {{ .Values.image.repository }}-fetcher:{{ .Values.image.fetcher.tag }}
          command: ["python", "scripts/store_database.py"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:{{ .Values.mongodb.port }}
            - name: PYTHONPATH
              value: /app
      restartPolicy: Never
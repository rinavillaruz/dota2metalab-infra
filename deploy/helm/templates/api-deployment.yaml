apiVersion: apps/v1
kind: Deployment
metadata:
  name: dota2metalab-api
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  progressDeadlineSeconds: 1200
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: dota2metalab-api
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        app: dota2metalab-api
        {{- if eq .Values.cloud "azure" }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: dota2metalab-api
      containers:
        - name: api
          image: {{ .Values.image.repository }}-api:{{ .Values.image.api.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:{{ .Values.mongodb.port }}
            - name: PYTHONPATH
              value: /app
            {{- if eq .Values.cloud "azure" }}
            - name: STORAGE_BACKEND
              value: azure
            - name: AZURE_STORAGE_ACCOUNT
              value: {{ .Values.azureStorage.account }}
            - name: AZURE_STORAGE_CONTAINER
              value: {{ .Values.azureStorage.container }}
            - name: S3_PREFIX
              value: {{ .Values.azureStorage.prefix }}
            {{- else }}
            - name: STORAGE_BACKEND
              value: s3
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
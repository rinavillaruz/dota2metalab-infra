# Global settings
global:
  namespace: dota2metalab-dev

# Image settings — GitHub Actions updates each tag independently
# Only the image that was rebuilt will have its tag updated
image:
  api:
    tag: latest
  fetcher:
    tag: 20260527171116-01430ab
  trainer:
    tag: 20260527171116-01430ab

# MongoDB settings
mongodb:
  persistence:
    size: 2Gi
    storageClassName: standard

# Models storage
models:
  persistence:
    size: 500Mi
    storageClassName: standard
# Global settings
global:
  namespace: dota2metalab-prod
# MongoDB settings
mongodb:
  persistence:
    size: 20Gi
# API settings
api:
  replicas: 3
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
# Models storage
models:
  persistence:
    size: 2Gi
ingress:
  enabled: true
  host: dota2metalab.com
image:
  api:
    tag: 20260609071410-e7c8b09
  fetcher:
    tag: 20260607130012-f98a865
  trainer:
    tag: 20260607130012-f98a865
s3:
  bucket: "dota2metalab-models-643297135135"
  prefix: "models/current"
irsa:
  roleArn: "arn:aws:iam::643297135135:role/dota2metalab-s3-models"
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilization: 70

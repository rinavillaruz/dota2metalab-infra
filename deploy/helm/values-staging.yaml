# Global settings
global:
  namespace: dota2metalab-staging
# MongoDB settings
mongodb:
  persistence:
    size: 5Gi
# API settings
api:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
# Models storage
models:
  persistence:
    size: 2Gi
ingress:
  enabled: true
  host: staging.dota2metalab.com
image:
  api:
    tag: 20260627191321-7713f60
  fetcher:
    tag: 20260627191321-7713f60
  trainer:
    tag: 20260627191321-7713f60
s3:
  bucket: "dota2metalab-models-400024183706"
  prefix: "models/staging"
irsa:
  roleArn: "arn:aws:iam::400024183706:role/dota2metalab-s3-models"
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilization: 70

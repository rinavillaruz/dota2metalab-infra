# Global settings
global:
  namespace: dota2metalab

# Which cloud's resources this release targets: "aws" (default, EKS)
# or "azure" (AKS). Controls ServiceAccount identity annotation and
# model storage backend - see templates/service-accounts.yaml,
# templates/api-deployment.yaml, templates/trainer-job.yaml.
# Set to "azure" only via values-*-aks.yaml overrides.
cloud: aws

# Image settings
image:
  repository: rinavillaruz/dota2metalab
  pullPolicy: Always
  api:
    tag: latest
  fetcher:
    tag: latest
  trainer:
    tag: latest

# MongoDB settings
mongodb:
  replicas: 1
  image: mongo:7.0
  port: 27017
  persistence:
    size: 5Gi
    storageClassName: gp3

# API settings
api:
  replicas: 1
  port: 8080

ingress:
  enabled: false
  host: 

irsa:
  roleArn: ""

s3:
  bucket: "dota2metalab-models-400024183706"
  prefix: "models/current"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70